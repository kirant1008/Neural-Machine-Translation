[project]
name = "neural-machine-translation"
version = "0.1.0"
description = "Neural Machine Translation (English to Vietnamese) using PyTorch seq2seq with bidirectional LSTM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "nltk",
    "tqdm",
]

[project.scripts]
nmt-train = "NMT:train"
nmt-test = "NMT:test"
nmt-translate = "NMT:translate"
